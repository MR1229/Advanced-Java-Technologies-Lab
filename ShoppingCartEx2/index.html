<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Customer Information</title>

<style>

body{
font-family:Arial;
background:#f2f2f2;
}

.container{

width:450px;
margin:50px auto;
background:white;
padding:20px;
border-radius:8px;
box-shadow:0 0 10px gray;

}

table{

width:100%;

}

td{

padding:8px;

}

input,textarea{

width:100%;
padding:8px;

}

input[type=submit]{

background:#007bff;
color:white;
border:none;
cursor:pointer;

}

</style>

</head>

<body>

<div class="container">

<h2 align="center">Customer Information</h2>

<form action="customer" method="post">

<table>

<tr>

<td>Name</td>

<td>

<input type="text"
name="name"
required>

</td>

</tr>

<tr>

<td>Mobile</td>

<td>

<input
type="text"
name="mobile"
required>

</td>

</tr>

<tr>

<td>Address</td>

<td>

<textarea
name="address"
rows="3">
</textarea>

</td>

</tr>

<tr>

<td colspan="2">

<input
type="submit"
value="Continue Shopping">

</td>

</tr>

</table>

</form>

</div>

</body>

</html>
