<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<title>Shopping Cart</title>

<style>

body{

font-family:Arial;
background:#f2f2f2;

}

.container{

width:450px;
margin:50px auto;
background:white;
padding:20px;
border-radius:8px;
box-shadow:0 0 10px gray;

}

input[type=submit]{

width:100%;
padding:10px;
background:green;
color:white;
border:none;

}

</style>

</head>

<body>

<div class="container">

<h2 align="center">Shopping Cart</h2>

<form action="cart" method="post">

<input type="checkbox" name="product" value="Laptop"> Laptop

<br><br>

<input type="checkbox" name="product" value="Mobile"> Mobile

<br><br>

<input type="checkbox" name="product" value="Headphones"> Headphones

<br><br>

<input type="checkbox" name="product" value="Keyboard"> Keyboard

<br><br>

<input type="checkbox" name="product" value="Mouse"> Mouse

<br><br>

<input
type="submit"
value="View Cart">

</form>

</div>

</body>

</html>
